<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estiloteladelogin.css">
    <link rel="icon" href="logohead.png">
    <title>AgroSier</title>
</head>
<body>
    <div style="display: flex; flex-direction: row;">
        <div id="divformlogin">
            <form action="" method="post">
                <fieldset id="fieldsetlogin">
                    <div style="width: 480px; text-align: left; margin-left: 100px;">
                        <h3 style="font-family: arial;">Entar no AgroSier</h3>
                    </div>
                    <div>
                        <label for="emaillogin"></label>
                        <input type="text" id="emaillogin" placeholder="E-mail">
                    </div>
                    <div>
                        <label for="senhalogin"></label>
                        <input type="password" id="senhalogin" placeholder="Senha">
                    </div>
                    <div>
                        <button  id="botaologin" type="submit">Entrar</button>
                    </div>
                    <div>
                        <button  id="botaoesqueceusenha" type="submit">Esqueceu a senha?</button>
                    </div>
                    <div style="display: flex; flex-direction: row; justify-content: center;">
                        <a href="teladecriarconta.html" id="botaocriarconta">Criar Conta</a>
                    </div>
                </fieldset>
            </form>
        </div>
        <div id="divimg">
            <img src="imglogin.png" alt="" style="width: 80%;">
        </div>
    </div>
</body>
</html>
