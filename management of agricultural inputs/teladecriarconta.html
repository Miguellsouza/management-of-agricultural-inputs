<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilocriarconta.css">
    <link rel="icon" href="logohead.png">
    <title>AgroSier</title>
</head>
<body>
    <div id="divformcriar">
        <form action="" method="post">
            <div style="display:flex; flex-direction: row; justify-content: center;">
                <div style="text-align: left;">
                    <h2 style="font-family: arial;">Cadastro do produtor</h2>
                    <p style="font-family: arial;">Cadastre-se para gerenciar seus insumos e acompanhar sua produção.</p>
                </div>
            </div>
            <fieldset  id="fieldsetcriar">
                <div>
                    <label for="inputcriaremail"></label>
                    <input class="inputcriarconta" type="text" placeholder="Nome completo do produtor">
                </div>
                <div>
                    <label for="inputcriarsenha"></label>
                    <input class="inputcriarconta" type="text" placeholder="CNPJ">
                </div>
                <div>
                    <label for="inputcriarsenha"></label>
                    <input class="inputcriarconta" type="email" placeholder="E-mail">
                </div>
                <div>
                    <label for="inputcriarsenha"></label>
                    <input class="inputcriarconta" type="tel" placeholder="Telefone">
                </div>
                <div>
                    <label for="inputcriarsenha"></label>
                    <input class="inputcriarconta" type="password" placeholder="Senha">
                </div>
                <div>
                    <label for="inputcriarsenha"></label>
                    <input class="inputcriarconta" type="password" placeholder="Confirmar senha">
                </div>
                <div>
                    <button id="botaocriar" type="submit">Criar</button>
                </div>
                <div>
                    <a href="teladelogin.html" id="buttonjatenhoconta">Já tenho uma conta</a>
                </div>
            </fieldset>
        </form>
    </div>
</body>
</html>
